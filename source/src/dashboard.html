<style>
:root{--bg:#101314;--panel:#1b2021;--line:#353c3d;--text:#f4f3ed;--muted:#acb7b5;--green:#caf37c;--blue:#90b9ff;--amber:#f0c078}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}button,select,input{font:inherit}button,select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:9px 13px;cursor:pointer}button:hover{border-color:var(--green)}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}header{border-bottom:1px solid var(--line);padding:18px 4%;display:flex;align-items:center;justify-content:space-between;gap:15px}header strong{font-size:16px;letter-spacing:-.2px}.label{color:var(--green);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}.subtle{color:var(--muted)}main{max-width:1400px;margin:auto;padding:36px 4% 64px}h1{font-size:clamp(32px,4vw,52px);letter-spacing:-1.6px;line-height:1.08;margin:12px 0 15px;max-width:920px}h2{font-size:21px;font-weight:600;letter-spacing:-.4px;margin:0 0 8px}h3{font-size:16px;margin:0 0 10px}.intro{font-size:17px;max-width:760px;color:var(--muted);margin:0 0 22px}.disclosure{font-size:12px;color:var(--amber);border-left:2px solid var(--amber);padding:4px 12px;margin-bottom:25px}.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}.tabs button{background:transparent;border-color:transparent;color:var(--muted)}.tabs button[aria-selected=true]{background:var(--green);color:#1a2414}.filters{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin:22px 0}.filters label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}select{max-width:260px;min-width:160px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.metric{border-top:1px solid var(--line);padding:16px 0 12px}.metric .num{font-size:38px;letter-spacing:-1px;margin:6px 0 2px}.metric .desc{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}.panel{background:var(--panel);border:1px solid #2c3334;border-radius:12px;padding:24px;margin-bottom:20px}.panel p{color:var(--muted);margin:0 0 20px;font-size:13px}.barrow{display:grid;grid-template-columns:165px 1fr 74px;gap:14px;align-items:center;margin:19px 0;font-size:13px}.barrow small{display:block;color:var(--muted);font-size:11px}.track{height:10px;background:#343d3a;border-radius:2px}.fill{height:100%;background:var(--green);border-radius:2px}.barrow strong{text-align:right;font-size:16px}.callout{padding:18px 0;border-top:1px solid var(--line)}.callout:first-of-type{border-top:0}.callout p{font-size:14px;margin:5px 0 0}.callout strong{color:var(--green)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}th,td{padding:12px;border-bottom:1px solid var(--line)}td.number{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:50px;text-align:center;color:var(--muted)}.note{font-size:12px;color:var(--muted);margin:14px 0}.split{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.pill{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:4px 9px;white-space:nowrap}.pill.warn{border-color:#795c35;color:var(--amber)}.methods{max-width:850px}.methods p{font-size:15px}.methods li{margin:8px 0;color:var(--muted)}.legend{display:flex;gap:20px;color:var(--muted);font-size:12px}.legend span:before{content:"";display:inline-block;width:9px;height:9px;background:var(--green);margin-right:6px}.legend span:nth-child(2):before{background:var(--blue)}footer{border-top:1px solid var(--line);padding-top:22px;margin-top:20px;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}svg{width:100%;height:auto;overflow:visible}.download{background:var(--green);color:#182115;border:0}.accessnote{font-size:12px;color:var(--muted)}@media(max-width:760px){header{align-items:flex-start}main{padding:25px 20px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.panel{padding:18px}.barrow{grid-template-columns:120px 1fr 60px;gap:9px}.metric .num{font-size:31px}select{min-width:120px;max-width:100%}.filters label{flex:1;min-width:130px}h1{letter-spacing:-1px}.disclosure{margin-bottom:18px}}@media print{body{background:white;color:black}.filters,.tabs,header button,.download{display:none}.panel{background:white;break-inside:avoid}.subtle,.note,.panel p,footer{color:#444}.fill{background:#456d21}.grid{display:block}}
</style></head><body>
<header><strong>FIELDNOTES <span class="subtle">/ Analyst portfolio</span></strong><a href="../index.html">All projects ↗</a></header>
<main><div class="label">__KICKER__</div><h1>__TITLE__</h1><p class="intro">__INTRO__</p><div class="disclosure">__DISCLOSURE__</div>
<nav class="tabs" role="tablist" aria-label="Analysis pages" id="tabs"></nav><div id="filters" class="filters"></div><div id="view" aria-live="polite"></div>
<footer><a href="case-study.md">Read the case study</a><a href="analysis.xlsx">Excel analysis</a><a href="interview.pptx">Interview presentation</a><a href="metrics.md">Metric definitions</a><a href="../interview-guide.md">Interview guide</a><span>Local analysis · No account or internet required</span></footer></main>
<script>const DATA=__DATA__;const PROJECT='__PROJECT__';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US'),pct=n=>n==null||!Number.isFinite(n)?'n/a':(n*100).toFixed(1)+'%',usd=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n),sum=(rs,key)=>rs.reduce((s,r)=>s+(Number(r[key])||0),0),ratio=(a,b)=>b?a/b:null;
let page='Overview',filters={},exportRows=[];const tabs=PROJECT==='retention'?['Overview','Validation','Outreach','Method']:['Overview','Demand','Method'];
function metric(label,value,desc){return `<div class="metric"><div class="subtle">${label}</div><div class="num">${value}</div><div class="desc">${desc}</div></div>`}
function bars(rows){return rows.length?rows.map(r=>`<div class="barrow"><div>${esc(r.label)}<small>${esc(r.note||'')}</small></div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,100*(r.value||0)))}%;background:${r.color||'var(--green)'}"></div></div><strong>${pct(r.value)}</strong></div>`).join(''):'<div class="empty">No matching observations. Reset the filters.</div>'}
function panel(title,note,body){return `<section class="panel"><h2>${title}</h2><p>${note}</p>${body}</section>`}
function callout(title,text){return `<div class="callout"><h3>${title}</h3><p>${text}</p></div>`}
function options(key,title,values){return `<label>${title}<select id="${key}" data-filter="${key}"><option value="">All</option>${values.map(v=>`<option${filters[key]===v?' selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}</select></label>`}
function download(){if(!exportRows.length)return;const keys=Object.keys(exportRows[0]);const cell=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replaceAll('"','""')+'"';const text=[keys,...exportRows.map(r=>keys.map(k=>r[k]))].map(r=>r.map(cell).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/csv'}));a.download=PROJECT+'-'+page.toLowerCase()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
const expOrder=['0–5 years','6–10 years','11–20 years','21+ years','Unknown'];
function group(rows,key){return Object.entries(rows.reduce((a,r)=>{(a[r[key]]??=[]).push(r);return a},{}))}
function filtered(rows){return rows.filter(r=>Object.entries(filters).every(([k,v])=>!v||r[k]===v))}
function topbar(){return `<div class="split"><span class="note">Filters apply to all metrics on this page.</span><button class="download" id="export">Export this view</button></div>`}
function draw(){
 $('#tabs').innerHTML=tabs.map(t=>`<button role="tab" aria-selected="${page===t}" data-page="${t}">${t}</button>`).join('');
 $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;filters={};draw()});
 if(PROJECT==='retention')renderRetention();else renderAI();
 $('#filters').querySelectorAll('select').forEach(s=>s.onchange=()=>{filters[s.dataset.filter]=s.value;draw()});
 const reset=$('#reset');if(reset)reset.onclick=()=>{filters={};draw()};const ex=$('#export');if(ex)ex.onclick=download;
}
function renderRetention(){
 const S=DATA.summary;const hist=DATA.clients.filter(r=>r.cohort!=='Upcoming');
 $('#filters').innerHTML=['Overview','Outreach'].includes(page)?options('tier','Subscription tier',[...new Set(hist.map(r=>r.tier))].sort())+options('industry','Industry',[...new Set(hist.map(r=>r.industry))].sort())+'<button id="reset">Reset filters</button>':'';
 if(page==='Overview'){
 const r=filtered(hist),rn=sum(r,'renewed'),value=sum(r,'annual_value_usd'),rv=sum(r.filter(x=>x.renewed===1),'annual_value_usd');exportRows=r;
 const monthly=group(r,'renewal_date').length;const byTier=group(r,'tier').map(([label,g])=>({label,value:ratio(sum(g,'renewed'),g.length),note:`${fmt(sum(g,'renewed'))} / ${fmt(g.length)} renewed`}));
 const byAct=group(r,'activated_30d').sort().map(([label,g])=>({label:label==='1'?'Activated in 30 days':'No first-month activity',value:ratio(sum(g,'renewed'),g.length),note:`n = ${fmt(g.length)}`,color:label==='1'?'var(--green)':'var(--blue)'}));
 const months=group(r.map(x=>({...x,month:x.renewal_date.slice(0,7)})),'month').sort();
 $('#view').innerHTML=topbar()+`<div class="metrics">${metric('Historical contracts',fmt(r.length),'Renewals due in 2025')}${metric('Client renewal rate',pct(ratio(rn,r.length)),`${fmt(rn)} renewed / ${fmt(r.length)} due`)}${metric('Contract value renewed',usd(rv),`${pct(ratio(rv,value))} of eligible annual value`)}${metric('First-month activation',pct(ratio(sum(r,'activated_30d'),r.length)),'At least one event in first 30 days')}</div><div class="grid">${panel('Renewal by subscription tier','Each bar uses contracts due in 2025, within the selected filters.',bars(byTier))}${panel('First-month engagement','Association in simulated data. This does not establish a causal onboarding effect.',bars(byAct))}</div>`+
 panel('Monthly renewal performance','Compare counts as well as percentages. September–December form the holdout period.',table(['Month','Contracts due','Renewed','Renewal rate'],months.map(([m,g])=>`<tr><td>${m}</td><td>${g.length}</td><td>${sum(g,'renewed')}</td><td>${pct(sum(g,'renewed')/g.length)}</td></tr>`)));
 }else if(page==='Validation'){
 const e=S.rule,c=S.capacity,rc=S.rule_capacity;exportRows=[{method:'Rule, all flags',...e},{method:'Model, top 20%',...c},{method:'Rule then value, top 20%',...rc}];
 $('#view').innerHTML=`<div class="metrics">${metric('Untouched holdout',fmt(e.n),'Renewals in Sep–Dec 2025')}${metric('Non-renewal base rate',pct(e.baseline),`${e.nonrenewals} / ${e.n} contracts`)}${metric('Model precision at capacity',pct(c.precision),`${c.tp} non-renewals / ${c.flagged} contacted`)}${metric('Model ranking AUC',S.model.auc.toFixed(3),'0.5 is chance ranking')}</div><div class="grid">`+
 panel('Same capacity, different targeting',`Both queues contain ${c.flagged} clients, about 20% of the holdout. Random selection is an expected benchmark, not a measured campaign.`,bars([{label:'Random selection',value:e.baseline,note:'Expected non-renewal share',color:'var(--blue)'},{label:'Rule, then contract value',value:rc.precision,note:`${rc.tp} / ${rc.flagged} non-renewals`},{label:'Logistic model rank',value:c.precision,note:`${c.tp} / ${c.flagged} non-renewals`}]))+
 panel('A useful model still misses clients','Results describe synthetic records only.',callout('False positives matter',`The full rule flags ${e.flagged} clients: ${e.fp} still renew. Its recall is ${pct(e.recall)}.`)+callout('The 0.5 threshold performs poorly',`It flags only ${S.model.flagged} clients and captures ${pct(S.model.recall)} of non-renewals. The capacity view is more useful for an outreach decision.`)+callout('No retention uplift claim','Correctly ranking non-renewals does not prove that contact changes renewal outcomes. A randomised pilot would test that.'))+'</div>'+
 panel('Reproducible evaluation','Features use only events on or before 60 days prior to each renewal.',table(['Method','Contacted','True positives','False positives','Recall'],exportRows.map(x=>`<tr><td>${x.method}</td><td>${x.flagged}</td><td>${x.tp}</td><td>${x.fp}</td><td>${pct(x.recall)}</td></tr>`)))+
 `<p class="note">Model settings and feature scaling were fixed before holdout evaluation. Brier score: ${S.model.brier.toFixed(3)} versus ${S.model.baseline_brier.toFixed(3)} for the training base-rate forecast. AUC measures ranking, not causal impact or real-world calibration.</p>`;
 }else if(page==='Outreach'){
 const q=filtered(DATA.queue);exportRows=q;const flags=q.filter(x=>x.rule_flag);const shown=q.slice(0,50);
 $('#view').innerHTML=topbar()+`<div class="metrics">${metric('Upcoming contracts',fmt(q.length),'All renew on 1 March 2026')}${metric('Rule-flagged clients',fmt(flags.length),'As of 31 December 2025')}${metric('Flagged annual value',usd(sum(flags,'annual_value_usd')),'Contract exposure, not recoverable revenue')}${metric('Visible queue',fmt(shown.length),'CSV export includes all matching records')}</div>`+
 panel('Review queue','Rule flags first, then model score × annual contract value. Scores are uncalibrated simulation estimates. Review evidence before action.',table(['Client','Tier','Annual value','Model score','Reason'],shown.map(r=>`<tr><td>${esc(r.client_id)}</td><td>${esc(r.tier)}</td><td>${usd(r.annual_value_usd)}</td><td>${pct(r.model_score)}</td><td>${esc(r.reason)}</td></tr>`)))+
 panel('Suggested pilot','Proposed experiment, not a completed intervention.',callout('Contact a small randomised subset','Within comparable flagged accounts, randomly assign outreach or usual service. Define the content of outreach before launch.')+callout('Measure incremental renewal','Compare renewal rates and support time at contract maturity. Check randomisation balance and monitor complaints. Set sample size from a business-relevant minimum effect.'));
 }else{
 $('#view').innerHTML=panel('Method and limitations','Synthetic subscription research platform. No affiliation with Gartner.',`<div class="methods"><h3>Decision</h3><p>Which accounts deserve limited outreach capacity before renewal?</p><h3>Data model</h3><p>Clients and contracts have one row per client. Activity and support contain many rows per client. Each fact table is aggregated before joining, preventing inflated counts and contract value.</p><h3>Time discipline</h3><p>Cutoff = renewal date minus 60 days. Recent activity uses (cutoff − 30 days, cutoff]. Previous activity uses (cutoff − 60 days, cutoff − 30 days]. Open tickets are determined as of cutoff. Jan–Aug renewals train the model; Sep–Dec renewals test it. Upcoming outcomes remain blank.</p><h3>Simple rule</h3><p>Flag no activity in 30 days, at least two open tickets, or a decline of at least 40% with at least five prior events and no expert session in 60 days.</p><h3>Machine learning</h3><p>Five features feed L2 logistic regression: recent activity, activity decline, no expert session, open support requests and initial activation. Zero prior activity makes decline undefined; the model fills it with zero and clips declines to [−3, 1]. Scaling uses training data only.</p><h3>Limits</h3><p>Simulated relationships reflect the generator. Account value is annual contract value, not accounting revenue, gross margin or money saved. The model has not been calibrated or validated on real clients. Results support a proposed experiment only.</p><h3>Reproduction</h3><p>See the package README, source SQL, data dictionary and recorded tests. The fixed seed is 113297.</p></div>`);
 }
}
function renderAI(){
 const all=DATA.cube;const dims=['experience_band','role','organization_size'];
 $('#filters').innerHTML=page==='Method'?'':options('experience_band','Work experience',[...new Set(all.map(r=>r.experience_band))].sort())+options('role','Developer role',[...new Set(all.map(r=>r.role))].sort())+options('organization_size','Employer size',[...new Set(all.map(r=>r.organization_size))].sort())+'<button id="reset">Reset filters</button>';
 const r=filtered(all),n=sum(r,'respondents'),answered=sum(r,'usage_answered'),users=sum(r,'current_user'),trust=sum(r,'trust_answered'),low=sum(r,'low_trust_user');
 const metricHtml=`<div class="metrics">${metric('Selected respondents',fmt(n),`${fmt(answered)} answered usage`)}${metric('Current AI usage',pct(ratio(users,answered)),`${fmt(users)} / ${fmt(answered)} usage answers`)}${metric('Low trust among users',pct(ratio(low,trust)),`${fmt(low)} / ${fmt(trust)} users answering trust`)}${metric('Missing usage answers',pct(ratio(n-answered,n)),`${fmt(n-answered)} excluded from usage denominator`)}</div>`;
 if(page==='Overview'){
 exportRows=r;const seg=group(r,'experience_band').sort((a,b)=>expOrder.indexOf(a[0])-expOrder.indexOf(b[0])).map(([label,g])=>({label,value:ratio(sum(g,'low_trust_user'),sum(g,'trust_answered')),note:`n = ${fmt(sum(g,'trust_answered'))}${sum(g,'trust_answered')<100?' · small sample':''}`}));
 $('#view').innerHTML=topbar()+metricHtml+`<div class="grid">`+
 panel('Trust among people already using AI','Somewhat or highly distrust. Denominator: current users who answered the trust question.',bars(seg))+
 panel('Usage and intention are different','Denominator: respondents who answered the usage question.',bars([{label:'Currently use AI',value:ratio(users,answered),note:fmt(users)+' respondents'},{label:'Plan to use soon',value:ratio(sum(r,'planned_user'),answered),note:fmt(sum(r,'planned_user'))+' respondents',color:'var(--blue)'},{label:'Do not plan to use',value:ratio(answered-users-sum(r,'planned_user'),answered),note:fmt(answered-users-sum(r,'planned_user'))+' respondents',color:'var(--amber)'}]))+'</div>'+
 panel('What this means for a content team','A content opportunity hypothesis, not measured client demand.',callout('Usage alone hides unmet needs',`${pct(ratio(low,trust))} of responding current users report distrust. Validation guidance is a topic to test with this audience.`)+callout('The denominator changes the story','All respondents, usage respondents and current users answering trust are different populations. Every card shows its own numerator and denominator.')+callout('Small segments require caution',trust<100?'This selection has fewer than 100 current users answering trust. Treat the result as descriptive only.':'Segment comparisons are exploratory. They do not control for country, role or employer differences.'));
 }else if(page==='Demand'){
 const d=sum(r,'frustration_denominator');const fr=group(filtered(DATA.frustration_cube),'frustration').map(([label,g])=>({label,n:sum(g,'respondents'),value:ratio(sum(g,'respondents'),d)})).sort((a,b)=>b.n-a.n);exportRows=fr.map(x=>({frustration:x.label,respondents:x.n,denominator:d,share:x.value}));
 $('#view').innerHTML=topbar()+metricHtml+panel('Problems reported by current AI users',`${fmt(d)} current users answered the multiple-choice frustration question. A person can select several options, so shares can sum above 100%.`,bars(fr.map(x=>({...x,note:`${fmt(x.n)} / ${fmt(d)}`}))))+
 panel('Content experiments to consider','Editorial hypotheses based on the full dataset. Filters change the evidence above; these proposals remain fixed.',table(['Proposed topic','Evidence to examine','Success measure'],[
 '<tr><td>Verifying AI-generated answers</td><td>Almost-right output and low trust</td><td>Completion and usefulness ratings in a small audience test</td></tr>',
 '<tr><td>Debugging AI-generated code</td><td>Reports of time-consuming debugging</td><td>Task completion time in a controlled exercise</td></tr>',
 '<tr><td>Understanding generated code</td><td>Reports that code is hard to understand</td><td>Comprehension before and after the session</td></tr>']))+
 '<p class="note">No LLM inferred these categories. They are the survey’s predefined response options. Interest is a proxy to investigate; it is not paid demand or Gartner client evidence.</p>';
 }else{
 $('#view').innerHTML=panel('Source and analysis design','Official public survey, analysed independently.',`<div class="methods"><h3>Population and provenance</h3><p>${esc(DATA.source.population_note)}</p><p><a href="${DATA.source.url}">Stack Overflow 2025 Developer Survey</a> · <a href="${DATA.source.methodology_url}">Methodology</a> · <a href="${DATA.source.data_url}">Data source</a></p><h3>Missingness</h3><p>Missing usage answers are excluded from adoption denominators. Missing trust answers are excluded from trust denominators. Blank work experience stays Unknown; the survey instructed respondents with zero experience to leave it blank, so Unknown cannot safely mean inexperienced.</p><h3>Trust metric</h3><p>Current users reporting Somewhat distrust or Highly distrust divided by current users answering trust. Neutral answers remain in the denominator. Planned users are excluded.</p><h3>Survey limitations</h3><p>Respondents self-selected, primarily through Stack Overflow channels. Descriptive Wilson intervals in the analysis file quantify binomial variation but do not correct selection or nonresponse bias. This is not a representative estimate of Gartner clients, companies or all developers.</p><h3>Multiple responses</h3><p>Frustrations split on semicolons and deduplicate each respondent/category pair. Their denominator is current users answering that question, not total selections.</p><h3>Attribution</h3><p>Stack Overflow survey database under ODbL 1.0, contents under DbCL 1.0. Derived survey data in this package retains those terms. Downloaded 30 September 2026. SHA-256 and retrieval details are in SOURCE.json.</p></div>`);
 }
}
draw();
</script></body></html>
